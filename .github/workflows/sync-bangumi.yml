name: Sync Bangumi Snapshot

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest Bangumi data
        run: python scripts/fetch_bangumi.py data.js

      - name: Commit updated snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data.js; then
            git add data.js
            git commit -m "chore: sync Bangumi snapshot"
            git push
          else
            echo "No changes in Bangumi snapshot."
          fi
